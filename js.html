<!-- QR Code Generator & jsPDF Libraries -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<script>
/**
 * ============================================================================
 * INFOTEP QR Generator - Client Application Controller
 * ============================================================================
 */

// Application Global State
const state = {
  version: "1.1.0",
  user: null,
  config: {},
  dashboard: {},
  qrs: [],
  users: [],
  currentView: "dashboard",
  qrFilter: "TODOS",
  qrSearch: "",
  userSearch: "",
  selectedColor: "#131360",
  selectedFormat: "PNG",
  selectedFrame: "BASICO",
  includeLogo: true,
  logoDataUrl: "",
  webAppUrl: "",
  previewCanvas: null,
  cachedLogoImg: null
};

// ============================================================================
// BUSY / LOADING CONTROLLER (With Counter Pattern)
// ============================================================================
const Busy = {
  count: 0,
  overlay: null,
  textEl: null,

  init() {
    this.overlay = document.getElementById("global-busy-overlay");
    this.textEl = document.getElementById("global-busy-text");
  },

  show(message = "Procesando...") {
    this.count++;
    if (this.textEl) this.textEl.textContent = message;
    if (this.overlay) {
      this.overlay.classList.remove("hidden");
      this.overlay.classList.add("flex");
    }
  },

  hide() {
    this.count = Math.max(0, this.count - 1);
    if (this.count === 0 && this.overlay) {
      this.overlay.classList.add("hidden");
      this.overlay.classList.remove("flex");
    }
  },

  reset() {
    this.count = 0;
    if (this.overlay) {
      this.overlay.classList.add("hidden");
      this.overlay.classList.remove("flex");
    }
  }
};

// ============================================================================
// TOAST & MODAL FEEDBACK SYSTEM
// ============================================================================
function showToast(message, type = "success") {
  const container = document.getElementById("toast-container");
  if (!container) return;

  const toast = document.createElement("div");
  const isSuccess = type === "success";
  const isError = type === "error";

  toast.className = `flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl border text-xs sm:text-sm font-medium transition-all duration-300 transform translate-y-2 opacity-0 ${
    isSuccess
      ? "bg-[#00260f] text-[#61de8a] border-[#009c51]/40"
      : isError
      ? "bg-[#93000a]/90 text-[#ffdad6] border-[#ffb4ab]/40"
      : "bg-surface-container-highest text-on-surface border-outline-variant/30"
  }`;

  const icon = isSuccess ? "check_circle" : isError ? "error" : "info";
  toast.innerHTML = `
    <span class="material-symbols-outlined text-[18px] sm:text-[20px]">${icon}</span>
    <span>${message}</span>
  `;

  container.appendChild(toast);

  requestAnimationFrame(() => {
    toast.classList.remove("translate-y-2", "opacity-0");
    toast.classList.add("translate-y-0", "opacity-100");
  });

  setTimeout(() => {
    toast.classList.remove("translate-y-0", "opacity-100");
    toast.classList.add("-translate-y-2", "opacity-0");
    setTimeout(() => toast.remove(), 300);
  }, 4000);
}

function showModal(options) {
  const modalEl = document.getElementById("generic-modal");
  const titleEl = document.getElementById("generic-modal-title");
  const messageEl = document.getElementById("generic-modal-message");
  const confirmBtn = document.getElementById("generic-modal-confirm");
  const cancelBtn = document.getElementById("generic-modal-cancel");

  if (!modalEl) return;

  titleEl.textContent = options.title || "Confirmación";
  messageEl.textContent = options.message || "¿Desea continuar?";

  if (options.confirmText) confirmBtn.textContent = options.confirmText;
  if (options.cancelText) cancelBtn.textContent = options.cancelText;

  confirmBtn.className = `flex-1 px-4 py-2.5 rounded-xl font-bold text-xs transition-all shadow-md ${
    options.danger
      ? "bg-error text-on-error hover:bg-error-container"
      : "bg-secondary text-on-secondary hover:bg-secondary-fixed"
  }`;

  const cleanup = () => {
    modalEl.classList.add("hidden");
    confirmBtn.onclick = null;
    cancelBtn.onclick = null;
  };

  confirmBtn.onclick = () => {
    cleanup();
    if (typeof options.onConfirm === "function") options.onConfirm();
  };

  cancelBtn.onclick = () => {
    cleanup();
    if (typeof options.onCancel === "function") options.onCancel();
  };

  modalEl.classList.remove("hidden");
}

// ============================================================================
// QR CODE GENERATION ENGINE (Error Correction Level H + Logo Overlay)
// ============================================================================

/**
 * Creates and renders the complete QR Code on Canvas with Level H error correction and centered INFOTEP logo
 */
function generateQRCodeCanvas(text, options = {}) {
  const size = options.size || 1024;
  const color = options.color || state.selectedColor || "#131360";
  const hasLogo = options.hasLogo !== undefined ? options.hasLogo : state.includeLogo;
  const frameStyle = options.frameStyle || state.selectedFrame || "BASICO";

  // 1. Generate QR Code Matrix with Error Correction Level H (30%)
  let typeNumber = 0;
  let qr;
  try {
    qr = qrcode(typeNumber, "H");
    qr.addData(text || "https://infotep.gob.do");
    qr.make();
  } catch (e) {
    qr = qrcode(10, "H");
    qr.addData(text || "https://infotep.gob.do");
    qr.make();
  }

  const moduleCount = qr.getModuleCount();
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  const isFramed = frameStyle === "ESCANAME";
  const qrAreaSize = size;
  const padding = Math.round(qrAreaSize * 0.08); // 8% quiet zone
  const usableSize = qrAreaSize - padding * 2;
  const cellSize = usableSize / moduleCount;

  if (isFramed) {
    const headerHeight = Math.round(size * 0.16);
    const footerHeight = Math.round(size * 0.16);
    canvas.width = size;
    canvas.height = size + headerHeight + footerHeight;

    // Card background
    ctx.fillStyle = "#ffffff";
    ctx.roundRect(0, 0, canvas.width, canvas.height, 36);
    ctx.fill();

    // Top Header Banner
    ctx.fillStyle = color;
    ctx.roundRect(0, 0, canvas.width, headerHeight, [36, 36, 0, 0]);
    ctx.fill();

    // Header Text
    ctx.fillStyle = "#ffffff";
    ctx.font = `bold ${Math.round(headerHeight * 0.38)}px Sora, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("INFOTEP • MERCADEO", canvas.width / 2, headerHeight / 2);

    // Translate to draw QR in middle
    ctx.save();
    ctx.translate(0, headerHeight);

    // Draw QR Modules
    drawQrMatrix(ctx, qr, moduleCount, padding, cellSize, color);

    // Draw Logo in Center if enabled
    if (hasLogo) {
      drawCenterLogo(ctx, size / 2, size / 2, Math.round(size * 0.20));
    }

    ctx.restore();

    // Bottom Footer Banner
    const footerY = canvas.height - footerHeight;
    ctx.fillStyle = "#ebc246";
    ctx.roundRect(24, footerY + 10, canvas.width - 48, footerHeight - 20, 20);
    ctx.fill();

    ctx.fillStyle = "#131360";
    ctx.font = `900 ${Math.round(footerHeight * 0.36)}px Sora, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("¡ESCÁNAME!", canvas.width / 2, footerY + footerHeight / 2);

  } else {
    // Basic Clean Frame
    canvas.width = size;
    canvas.height = size;

    // Pure White background
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, size, size);

    // Draw QR Modules
    drawQrMatrix(ctx, qr, moduleCount, padding, cellSize, color);

    // Draw Center Logo
    if (hasLogo) {
      drawCenterLogo(ctx, size / 2, size / 2, Math.round(size * 0.20));
    }
  }

  return canvas;
}

/**
 * Draws the QR Code modules onto context
 */
function drawQrMatrix(ctx, qr, count, padding, cellSize, color) {
  ctx.fillStyle = color;
  for (let r = 0; r < count; r++) {
    for (let c = 0; c < count; c++) {
      if (qr.isDark(r, c)) {
        const x = padding + c * cellSize;
        const y = padding + r * cellSize;
        ctx.fillRect(Math.round(x), Math.round(y), Math.ceil(cellSize), Math.ceil(cellSize));
      }
    }
  }
}

/**
 * Draws the protected center shield and the INFOTEP institutional logo
 */
function drawCenterLogo(ctx, cx, cy, logoSize) {
  const badgeSize = logoSize + 14;
  const radius = Math.round(badgeSize * 0.25);

  ctx.save();
  // 1. White Background Shield with rounded corners
  ctx.fillStyle = "#ffffff";
  ctx.shadowColor = "rgba(0, 0, 0, 0.20)";
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.roundRect(cx - badgeSize / 2, cy - badgeSize / 2, badgeSize, badgeSize, radius);
  ctx.fill();

  // Border
  ctx.shadowColor = "transparent";
  ctx.strokeStyle = "#e2e0fc";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // 2. Draw Cached or Loaded Logo
  if (state.cachedLogoImg && state.cachedLogoImg.complete && state.cachedLogoImg.naturalWidth > 0) {
    ctx.drawImage(state.cachedLogoImg, cx - logoSize / 2, cy - logoSize / 2, logoSize, logoSize);
  } else if (state.logoDataUrl) {
    const img = new Image();
    img.src = state.logoDataUrl;
    state.cachedLogoImg = img;
    if (img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, cx - logoSize / 2, cy - logoSize / 2, logoSize, logoSize);
    } else {
      drawFallbackCenterMotif(ctx, cx, cy, logoSize);
    }
  } else {
    drawFallbackCenterMotif(ctx, cx, cy, logoSize);
  }

  ctx.restore();
}

function drawFallbackCenterMotif(ctx, cx, cy, logoSize) {
  ctx.fillStyle = "#131360";
  ctx.beginPath();
  ctx.arc(cx, cy, logoSize * 0.44, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = "#ebc246";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(cx, cy, logoSize * 0.32, 0.5, Math.PI * 1.8);
  ctx.stroke();

  ctx.fillStyle = "#009c51";
  ctx.fillRect(cx - 8, cy - 8, 16, 16);
}

/**
 * Updates the live interactive preview box on the 'Generar QR' screen
 */
function updateLivePreview() {
  const previewContainer = document.getElementById("qr-preview-target");
  if (!previewContainer) return;

  const urlInput = document.getElementById("qr-url");
  const nameInput = document.getElementById("qr-name");

  const rawUrl = (urlInput && urlInput.value.trim()) || "https://instagram.com/infotep";
  const name = (nameInput && nameInput.value.trim()) || "Campaña INFOTEP";

  const isDynamic = document.querySelector('input[name="qr-type"]:checked')?.value === "dynamic";
  // If static: encode rawUrl DIRECTLY! If dynamic: encode redirect url
  const targetEncode = isDynamic && state.webAppUrl ? `${state.webAppUrl}?r=preview` : rawUrl;

  const canvas = generateQRCodeCanvas(targetEncode, {
    size: 512,
    color: state.selectedColor,
    hasLogo: state.includeLogo,
    frameStyle: state.selectedFrame,
    name: name
  });

  previewContainer.innerHTML = "";
  canvas.className = "w-full h-full object-contain rounded-xl";
  previewContainer.appendChild(canvas);
  state.previewCanvas = canvas;
}

// ============================================================================
// EXPORT HANDLERS (PNG, SVG, PDF)
// ============================================================================

function exportCurrentQR() {
  const nameInput = document.getElementById("qr-name");
  const urlInput = document.getElementById("qr-url");

  const name = (nameInput && nameInput.value.trim()) || "codigo_qr_infotep";
  const cleanFilename = name.toLowerCase().replace(/[^a-z0-9]+/g, "_") + "_" + Date.now();

  const url = (urlInput && urlInput.value.trim()) || "https://infotep.gob.do";
  const isDynamic = document.querySelector('input[name="qr-type"]:checked')?.value === "dynamic";

  Busy.show("Guardando y generando recurso...");

  google.script.run
    .withSuccessHandler((res) => {
      Busy.hide();
      if (res && res.success) {
        showToast("Código QR guardado exitosamente");
        state.qrs.unshift(res.qr);
        renderRepository();
        renderDashboard();

        // For static QR, encode exact targetUrl directly. For dynamic, encode webAppUrl?r=id
        const finalUrl = isDynamic ? (res.qr.shortUrl.startsWith("http") ? res.qr.shortUrl : (state.webAppUrl + res.qr.shortUrl)) : res.qr.targetUrl;
        
        const fullCanvas = generateQRCodeCanvas(finalUrl, {
          size: 1200,
          color: state.selectedColor,
          hasLogo: state.includeLogo,
          frameStyle: state.selectedFrame,
          name: name
        });

        triggerDownload(fullCanvas, cleanFilename, name, finalUrl);
      }
    })
    .withFailureHandler((err) => {
      Busy.hide();
      showToast(err.message || "Error al guardar el código QR", "error");
    })
    .apiSaveQR({
      name: name,
      targetUrl: url,
      type: isDynamic ? "DINAMICO" : "ESTATICO",
      colorHex: state.selectedColor,
      hasLogo: state.includeLogo,
      frameStyle: state.selectedFrame
    });
}

function triggerDownload(canvas, filename, title, destinationUrl) {
  if (state.selectedFormat === "PNG") {
    const link = document.createElement("a");
    link.download = `${filename}.png`;
    link.href = canvas.toDataURL("image/png", 1.0);
    link.click();
    showToast("Descarga completada: PNG en Alta Resolución");
  } else if (state.selectedFormat === "SVG") {
    downloadAsSVG(destinationUrl, filename, title);
  } else if (state.selectedFormat === "PDF") {
    downloadAsPDF(canvas, filename, title, destinationUrl);
  }
}

function downloadAsSVG(text, filename, title) {
  const qr = qrcode(0, "H");
  qr.addData(text);
  qr.make();
  const count = qr.getModuleCount();
  const size = 1000;
  const padding = 80;
  const cellSize = (size - padding * 2) / count;

  let rects = "";
  for (let r = 0; r < count; r++) {
    for (let c = 0; c < count; c++) {
      if (qr.isDark(r, c)) {
        rects += `<rect x="${padding + c * cellSize}" y="${padding + r * cellSize}" width="${cellSize}" height="${cellSize}" fill="${state.selectedColor}" />\n`;
      }
    }
  }

  let logoSvg = "";
  if (state.includeLogo && state.logoDataUrl) {
    const logoSize = size * 0.20;
    const center = size / 2;
    logoSvg = `
      <rect x="${center - (logoSize + 14) / 2}" y="${center - (logoSize + 14) / 2}" width="${logoSize + 14}" height="${logoSize + 14}" rx="18" fill="#ffffff" stroke="#e2e0fc" stroke-width="2" />
      <image href="${state.logoDataUrl}" x="${center - logoSize / 2}" y="${center - logoSize / 2}" width="${logoSize}" height="${logoSize}" />
    `;
  }

  const svgContent = `<?xml version="1.0" standalone="no"?>
<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <title>${title}</title>
  <rect width="${size}" height="${size}" fill="#ffffff" />
  ${rects}
  ${logoSvg}
</svg>`;

  const blob = new Blob([svgContent], { type: "image/svg+xml;charset=utf-8" });
  const link = document.createElement("a");
  link.download = `${filename}.svg`;
  link.href = URL.createObjectURL(blob);
  link.click();
  showToast("Vector SVG descargado exitosamente");
}

function downloadAsPDF(canvas, filename, title, destinationUrl) {
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({
      orientation: "portrait",
      unit: "mm",
      format: "a4"
    });

    // Background header band
    doc.setFillColor(19, 19, 96);
    doc.rect(0, 0, 210, 35, "F");

    // Header Text
    doc.setTextColor(255, 255, 255);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(18);
    doc.text("INFOTEP - DEPARTAMENTO DE MERCADEO", 105, 18, { align: "center" });

    doc.setFontSize(10);
    doc.setTextColor(235, 194, 70);
    doc.text("Recurso Oficial - Código QR Institucional", 105, 26, { align: "center" });

    // Campaign Title
    doc.setTextColor(17, 17, 37);
    doc.setFontSize(16);
    doc.setFont("helvetica", "bold");
    doc.text(title, 105, 52, { align: "center" });

    // QR Image Centered
    const imgData = canvas.toDataURL("image/png");
    const qrWidthMm = 115;
    const qrHeightMm = (canvas.height / canvas.width) * qrWidthMm;
    const qrX = (210 - qrWidthMm) / 2;
    doc.addImage(imgData, "PNG", qrX, 60, qrWidthMm, qrHeightMm);

    // Destination Info Card
    const infoY = 60 + qrHeightMm + 12;
    doc.setFillColor(245, 245, 250);
    doc.roundedRect(25, infoY, 160, 24, 4, 4, "F");

    doc.setFontSize(8);
    doc.setTextColor(100, 100, 120);
    doc.text("ENLACE DE DESTINO:", 32, infoY + 8);

    doc.setFontSize(9);
    doc.setTextColor(19, 19, 96);
    doc.text(destinationUrl.length > 70 ? destinationUrl.substring(0, 67) + "..." : destinationUrl, 32, infoY + 16);

    // Footer
    doc.setFontSize(8);
    doc.setTextColor(150, 150, 160);
    doc.text(`Generado el ${new Date().toLocaleDateString("es-DO")} a través del Sistema Generador de QRs INFOTEP.`, 105, 285, { align: "center" });

    doc.save(`${filename}.pdf`);
    showToast("PDF listo para impresión descargado");
  } catch (e) {
    showToast("Error generando PDF: " + e.message, "error");
  }
}

// ============================================================================
// NAVIGATION & VIEW SWITCHING (SPA Router)
// ============================================================================

function navigateTo(viewName) {
  state.currentView = viewName;

  // Close mobile sidebar if open
  closeMobileSidebar();

  const views = ["dashboard", "generar-qr", "mis-codigos", "gestion-usuarios", "configuracion"];
  views.forEach((v) => {
    const el = document.getElementById(`view-${v}`);
    if (el) el.classList.add("hidden");
  });

  const target = document.getElementById(`view-${viewName}`);
  if (target) target.classList.remove("hidden");

  document.querySelectorAll("[data-nav-view]").forEach((link) => {
    const isTarget = link.getAttribute("data-nav-view") === viewName;
    if (isTarget) {
      link.className = "flex items-center gap-3 px-4 py-3 rounded-xl bg-primary-container text-on-primary-container font-bold transition-all shadow-sm";
    } else {
      link.className = "flex items-center gap-3 px-4 py-3 rounded-xl text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-all";
    }
  });

  if (viewName === "dashboard") renderDashboard();
  if (viewName === "mis-codigos") renderRepository();
  if (viewName === "gestion-usuarios") renderUsersTable();
  if (viewName === "generar-qr") updateLivePreview();
}

function openMobileSidebar() {
  const sidebar = document.getElementById("main-sidebar");
  const backdrop = document.getElementById("sidebar-backdrop");
  if (sidebar) {
    sidebar.classList.remove("-translate-x-full");
    sidebar.classList.add("translate-x-0");
  }
  if (backdrop) backdrop.classList.remove("hidden");
}

function closeMobileSidebar() {
  const sidebar = document.getElementById("main-sidebar");
  const backdrop = document.getElementById("sidebar-backdrop");
  if (sidebar) {
    sidebar.classList.add("-translate-x-full");
    sidebar.classList.remove("translate-x-0");
  }
  if (backdrop) backdrop.classList.add("hidden");
}

// ============================================================================
// VIEW RENDERERS
// ============================================================================

function renderDashboard() {
  const d = state.dashboard || {};
  const totalQrsEl = document.getElementById("dash-total-qrs");
  const totalScansEl = document.getElementById("dash-total-scans");
  const dynamicCountEl = document.getElementById("dash-dynamic-count");
  const dynamicPctEl = document.getElementById("dash-dynamic-pct");

  if (totalQrsEl) totalQrsEl.textContent = Number(d.totalQRs || state.qrs.length).toLocaleString();
  if (totalScansEl) totalScansEl.textContent = Number(d.totalScans || 0).toLocaleString();
  if (dynamicCountEl) dynamicCountEl.textContent = Number(d.dynamicCount || 0).toLocaleString();
  if (dynamicPctEl) dynamicPctEl.textContent = `${d.dynamicPercent || 0}% del total`;

  // Render Recent Activity List
  const activityContainer = document.getElementById("dash-recent-list");
  if (activityContainer) {
    const recent = (state.qrs || []).slice(0, 4);
    if (recent.length === 0) {
      activityContainer.innerHTML = `<div class="p-6 text-center text-on-surface-variant text-sm">No hay códigos QR creados aún.</div>`;
    } else {
      activityContainer.innerHTML = recent
        .map((qr) => {
          const isDyn = qr.type === "DINAMICO";
          return `
          <div class="bg-surface-container p-3.5 rounded-xl flex items-center justify-between group hover:bg-surface-container-high transition-colors">
            <div class="flex items-center gap-3.5">
              <div class="w-10 h-10 bg-surface flex items-center justify-center rounded-lg border border-outline-variant/20">
                <span class="material-symbols-outlined text-primary text-[20px]">${isDyn ? "qr_code_2" : "link"}</span>
              </div>
              <div class="flex flex-col">
                <span class="font-headline-md text-xs sm:text-sm text-on-surface font-semibold group-hover:text-primary transition-colors">${escapeHtml(qr.name)}</span>
                <span class="font-body-sm text-[11px] text-on-surface-variant">${formatDate(qr.createdAt)} • ${qr.scanCount || 0} escaneos</span>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${
                isDyn ? "bg-tertiary/10 text-tertiary" : "bg-surface-container-highest text-on-surface-variant"
              }">${qr.type}</span>
              <button onclick="openPreviewModal('${qr.id}')" class="p-1.5 text-on-surface-variant hover:text-secondary rounded-lg hover:bg-surface transition-colors" title="Ver QR">
                <span class="material-symbols-outlined text-[18px]">visibility</span>
              </button>
            </div>
          </div>
        `;
        })
        .join("");
    }
  }

  // Render Top Performing QR (NO OVERLAP)
  const topQrCard = document.getElementById("dash-top-qr-card");
  if (topQrCard) {
    const sorted = [...(state.qrs || [])].sort((a, b) => (b.scanCount || 0) - (a.scanCount || 0));
    const top = sorted[0];
    if (top) {
      document.getElementById("dash-top-qr-name").textContent = top.name;
      document.getElementById("dash-top-qr-scans").textContent = `${Number(top.scanCount || 0).toLocaleString()} Escaneos Totales`;
      const thumb = document.getElementById("dash-top-qr-thumb");
      if (thumb) {
        const isDyn = top.type === "DINAMICO";
        const encodeUrl = isDyn && state.webAppUrl ? `${state.webAppUrl}?r=${top.id}` : top.targetUrl;
        const miniCanvas = generateQRCodeCanvas(encodeUrl, { size: 180, color: top.colorHex, hasLogo: top.hasLogo });
        miniCanvas.className = "w-full h-full object-contain rounded-lg";
        thumb.innerHTML = "";
        thumb.appendChild(miniCanvas);
      }
    }
  }
}

function renderRepository() {
  const container = document.getElementById("qrs-table-body");
  if (!container) return;

  const query = state.qrSearch.toLowerCase().trim();
  const filter = state.qrFilter;

  const filtered = state.qrs.filter((qr) => {
    if (filter === "DINAMICOS" && qr.type !== "DINAMICO") return false;
    if (filter === "ESTATICOS" && qr.type !== "ESTATICO") return false;
    if (query && !qr.name.toLowerCase().includes(query) && !qr.targetUrl.toLowerCase().includes(query)) return false;
    return true;
  });

  document.getElementById("repo-total-count").textContent = `Mostrando ${filtered.length} de ${state.qrs.length} códigos`;

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="p-12 text-center text-on-surface-variant flex flex-col items-center gap-3">
        <span class="material-symbols-outlined text-4xl opacity-40">folder_off</span>
        <p class="text-sm">No se encontraron códigos QR con los filtros seleccionados.</p>
      </div>
    `;
    return;
  }

                     <span class="material-symbols-outlined text-[16px]">edit_square</span>

            }

          <span class="text-[10px] ${isDyn ? "text-tertiary" : "text-on-surface-variant"} font-semibold mt-0.5">${isDyn ? (qr.scanCount || 0) + ' escaneos' : 'Enlace Directo'}</span>
        </div>

        <!-- Date -->
        <div class="col-span-1 text-xs text-on-surface-variant">
          ${formatShortDate(qr.createdAt)}

        <!-- Actions -->
        <div class="col-span-2 flex justify-end gap-2">
          <button onclick="downloadQrById('${qr.id}')" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-surface-container-highest hover:bg-secondary hover:text-on-secondary text-on-surface flex items-center justify-center transition-all shadow-sm" title="Descargar PNG">
            <span class="material-symbols-outlined text-[18px]">download</span>

          ${

              ? `<button onclick="confirmDeleteQR('${qr.id}', '${escapeHtml(qr.name)}')" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-surface-container-highest hover:bg-error-container hover:text-on-error-container text-on-surface flex items-center justify-center transition-all" title="Eliminar">

              ${initials || "U"}

              <span class="text-[11px] text-on-surface-variant">${escapeHtml(u.email)}</span>

function openPreviewModal(qrId) {
  const qr = state.qrs.find((q) => q.id === qrId);
  if (!qr) return;

  const modal = document.getElementById("qr-preview-modal");
  const target = document.getElementById("qr-preview-modal-canvas");
  const title = document.getElementById("qr-preview-modal-title");
  const linkText = document.getElementById("qr-preview-modal-link-text");
  const link = document.getElementById("qr-preview-modal-link");
  const typeChip = document.getElementById("qr-preview-modal-type-chip");
  const scanCount = document.getElementById("qr-preview-modal-scan-count");

  const isDyn = qr.type === "DINAMICO";
  const finalUrl = isDyn && state.webAppUrl ? `${state.webAppUrl}?r=${qr.id}` : qr.targetUrl;

  title.textContent = qr.name;
  typeChip.textContent = isDyn ? "QR DINÁMICO" : "QR ESTÁTICO (DIRECTO)";
  typeChip.className = isDyn ? "px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-primary/15 text-primary self-start uppercase" : "px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-secondary/15 text-secondary self-start uppercase";

  scanCount.textContent = isDyn ? `${qr.scanCount || 0} escaneos` : "Enlace Directo";
  linkText.textContent = qr.targetUrl;
  link.href = qr.targetUrl;

  const canvas = generateQRCodeCanvas(finalUrl, {
    size: 512,
    color: qr.colorHex,
    hasLogo: qr.hasLogo,
    frameStyle: qr.frameStyle,
    name: qr.name
  });

  target.innerHTML = "";
  canvas.className = "w-full h-full object-contain rounded-xl";
  target.appendChild(canvas);

  const cleanFilename = qr.name.toLowerCase().replace(/[^a-z0-9]+/g, "_");

  document.getElementById("btn-modal-download-png").onclick = () => {
    const fullCanvas = generateQRCodeCanvas(finalUrl, { size: 1200, color: qr.colorHex, hasLogo: qr.hasLogo, frameStyle: qr.frameStyle, name: qr.name });
    triggerDownload(fullCanvas, cleanFilename, qr.name, finalUrl);
  };

  document.getElementById("btn-modal-download-svg").onclick = () => {
    downloadAsSVG(finalUrl, cleanFilename, qr.name);
  };

  document.getElementById("btn-modal-download-pdf").onclick = () => {
    const fullCanvas = generateQRCodeCanvas(finalUrl, { size: 1200, color: qr.colorHex, hasLogo: qr.hasLogo, frameStyle: qr.frameStyle, name: qr.name });
    downloadAsPDF(fullCanvas, cleanFilename, qr.name, qr.targetUrl);
  };

  modal.classList.remove("hidden");
}

function closePreviewModal() {
  const modal = document.getElementById("qr-preview-modal");
  if (modal) modal.classList.add("hidden");
}

function downloadQrById(qrId) {
  const qr = state.qrs.find((q) => q.id === qrId);
  if (!qr) return;
  const isDyn = qr.type === "DINAMICO";
  const encodeUrl = isDyn && state.webAppUrl ? `${state.webAppUrl}?r=${qr.id}` : qr.targetUrl;
  const canvas = generateQRCodeCanvas(encodeUrl, {
    size: 1200,
    color: qr.colorHex,
    hasLogo: qr.hasLogo,
    frameStyle: qr.frameStyle,
    name: qr.name
  });
  triggerDownload(canvas, qr.name.toLowerCase().replace(/[^a-z0-9]+/g, "_"), qr.name, encodeUrl);
}

function openEditUrlModal(qrId, currentUrl) {
  const modal = document.getElementById("edit-destination-modal");
  const idInput = document.getElementById("edit-modal-qr-id");
  const urlInput = document.getElementById("edit-modal-new-url");

  if (!modal || !idInput || !urlInput) return;

  idInput.value = qrId;
  urlInput.value = currentUrl;
  modal.classList.remove("hidden");
}

function closeEditUrlModal() {
  const modal = document.getElementById("edit-destination-modal");
  if (modal) modal.classList.add("hidden");
}

function saveUpdatedUrl() {
  const id = document.getElementById("edit-modal-qr-id").value;
  const newUrl = document.getElementById("edit-modal-new-url").value.trim();

  if (!newUrl) {
    showToast("Por favor introduce una URL válida", "error");
    return;
  }

  Busy.show("Actualizando destino dinámico...");
  closeEditUrlModal();

  google.script.run
    .withSuccessHandler((res) => {
      Busy.hide();
      if (res && res.success) {
        showToast("Destino dinámico actualizado correctamente");
        const found = state.qrs.find((q) => q.id === id);
        if (found) {
          found.targetUrl = newUrl;
          found.updatedAt = res.updatedAt;
        }
        renderRepository();
      }
    })
    .withFailureHandler((err) => {
      Busy.hide();
      showToast(err.message || "Error al actualizar URL", "error");
    })
    .apiUpdateQRUrl(id, newUrl);
}

function confirmDeleteQR(qrId, qrName) {
  showModal({
    title: "Eliminar Código QR",
    message: `¿Estás seguro de que deseas eliminar permanentemente el código "${qrName}"? Esta acción no se puede deshacer.`,
    confirmText: "Eliminar",
    danger: true,
    onConfirm: () => {
      Busy.show("Eliminando código QR...");
      google.script.run
        .withSuccessHandler((res) => {
          Busy.hide();
          showToast("Código QR eliminado");
          state.qrs = state.qrs.filter((q) => q.id !== qrId);
          renderRepository();
          renderDashboard();
        })
        .withFailureHandler((err) => {
          Busy.hide();
          showToast(err.message || "Error al eliminar", "error");
        })
        .apiDeleteQR(qrId);
    }
  });
}

function openAddUserModal() {
  document.getElementById("user-modal-form").reset();
  document.getElementById("user-modal-is-edit").value = "false";
  document.getElementById("user-modal-title").textContent = "Agregar Nuevo Usuario";
  document.getElementById("add-user-modal").classList.remove("hidden");
}

function openEditUserModal(email, name, role, department) {
  document.getElementById("user-modal-email").value = email;
  document.getElementById("user-modal-name").value = name;
  document.getElementById("user-modal-role").value = role.toLowerCase();
  document.getElementById("user-modal-dept").value = department;
  document.getElementById("user-modal-is-edit").value = "true";
  document.getElementById("user-modal-title").textContent = "Editar Usuario";
  document.getElementById("add-user-modal").classList.remove("hidden");
}

function closeAddUserModal() {
  document.getElementById("add-user-modal").classList.add("hidden");
}

function saveUserForm(e) {
  e.preventDefault();
  const email = document.getElementById("user-modal-email").value.trim();
  const name = document.getElementById("user-modal-name").value.trim();
  const role = document.getElementById("user-modal-role").value.toUpperCase();
  const dept = document.getElementById("user-modal-dept").value.trim() || "Mercadeo";

  if (!email || !name) {
    showToast("Completa los campos obligatorios", "error");
    return;
  }

  Busy.show("Guardando usuario...");
  closeAddUserModal();

  google.script.run
    .withSuccessHandler((res) => {
      Busy.hide();
      if (res && res.success) {
        showToast("Usuario guardado exitosamente");
        google.script.run.withSuccessHandler((users) => {
          state.users = users;
          renderUsersTable();
        }).apiGetUsers();
      }
    })
    .withFailureHandler((err) => {
      Busy.hide();
      showToast(err.message || "Error al guardar usuario", "error");
    })
    .apiSaveUser({
      email: email,
      name: name,
      role: role,
      department: dept,
      status: "ACTIVO"
    });
}

function toggleUserStatus(email, newStatus) {
  Busy.show("Actualizando estado...");
  google.script.run
    .withSuccessHandler((res) => {
      Busy.hide();
      showToast(`Estado actualizado a ${newStatus}`);
      const user = state.users.find((u) => u.email === email);
      if (user) user.status = newStatus;
      renderUsersTable();
    })
    .withFailureHandler((err) => {
      Busy.hide();
      showToast(err.message || "Error al actualizar estado", "error");
    })
    .apiToggleUserStatus(email, newStatus);
}

function initApp(bootstrapData) {
  Busy.init();

  if (bootstrapData) {
    state.version = bootstrapData.version || "1.1.0";
    state.user = bootstrapData.user || {};
    state.config = bootstrapData.config || {};
    state.dashboard = bootstrapData.dashboard || {};
    state.qrs = bootstrapData.qrs || [];
    state.users = bootstrapData.users || [];
    state.webAppUrl = bootstrapData.webAppUrl || "";
    state.logoDataUrl = bootstrapData.logoDataUrl || "";

    if (state.logoDataUrl) {
      const img = new Image();
      img.src = state.logoDataUrl;
      state.cachedLogoImg = img;
    }

    document.getElementById("user-display-name").textContent = state.user.name || "Colaborador";
    document.getElementById("user-display-role").textContent = state.user.role === "ADMIN" ? "Administrador Mercadeo" : "Usuario Mercadeo";
    const initials = (state.user.name || "U")
      .split(" ")
      .map((n) => n[0])
      .slice(0, 2)
      .join("")
      .toUpperCase();
    document.getElementById("user-avatar-initials").textContent = initials;

    if (state.user.role !== "ADMIN") {
      document.querySelectorAll(".admin-only").forEach((el) => el.classList.add("hidden"));
    }

    if (state.logoDataUrl) {
      document.getElementById("sidebar-logo-img").src = state.logoDataUrl;
    }

    renderDashboard();
    renderRepository();
    if (state.user.role === "ADMIN") renderUsersTable();
    updateLivePreview();
  }

  setupEventListeners();
}

function setupEventListeners() {
  // Mobile Sidebar Drawer Events
  const mobileMenuBtn = document.getElementById("mobile-menu-btn");
  const sidebarCloseBtn = document.getElementById("sidebar-close-btn");
  const sidebarBackdrop = document.getElementById("sidebar-backdrop");

  if (mobileMenuBtn) mobileMenuBtn.addEventListener("click", openMobileSidebar);
  if (sidebarCloseBtn) sidebarCloseBtn.addEventListener("click", closeMobileSidebar);
  if (sidebarBackdrop) sidebarBackdrop.addEventListener("click", closeMobileSidebar);

  // Navigation
  document.querySelectorAll("[data-nav-view]").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      const view = btn.getAttribute("data-nav-view");
      navigateTo(view);
    });
  });

  // Color Swatches Selection
  document.querySelectorAll(".color-swatch-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".color-swatch-btn").forEach((b) => b.classList.remove("ring-2", "ring-primary", "ring-offset-2", "ring-offset-surface-container-high"));
      btn.classList.add("ring-2", "ring-primary", "ring-offset-2", "ring-offset-surface-container-high");
      state.selectedColor = btn.getAttribute("data-color");
      updateLivePreview();
    });
  });

  // Custom Color Input
  const customColorInput = document.getElementById("custom-color-input");
  if (customColorInput) {
    customColorInput.addEventListener("input", (e) => {
      state.selectedColor = e.target.value;
      updateLivePreview();
    });
  }

  // Format Pills
  document.querySelectorAll(".format-pill-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".format-pill-btn").forEach((b) => {
        b.classList.remove("bg-surface-container", "text-primary", "shadow-sm");
        b.classList.add("text-on-surface-variant");
      });
      btn.classList.add("bg-surface-container", "text-primary", "shadow-sm");
      btn.classList.remove("text-on-surface-variant");
      state.selectedFormat = btn.getAttribute("data-format");
    });
  });

  // Frame Style Selection
  document.querySelectorAll(".frame-style-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".frame-style-btn").forEach((b) => {
        b.classList.remove("border-2", "border-primary", "bg-primary/5", "text-primary");
        b.classList.add("border", "border-outline-variant/30", "bg-surface-container-low", "text-on-surface-variant");
      });
      btn.classList.add("border-2", "border-primary", "bg-primary/5", "text-primary");
      btn.classList.remove("border-outline-variant/30", "bg-surface-container-low", "text-on-surface-variant");
      state.selectedFrame = btn.getAttribute("data-frame");
      updateLivePreview();
    });
  });

  // Include Logo Toggle
  const logoToggle = document.getElementById("toggle-include-logo");
  if (logoToggle) {
    logoToggle.addEventListener("change", (e) => {
      state.includeLogo = e.target.checked;
      updateLivePreview();
    });
  }

  // Live Input Changes
  const nameInput = document.getElementById("qr-name");
  const urlInput = document.getElementById("qr-url");
  if (nameInput) nameInput.addEventListener("input", debounce(updateLivePreview, 250));
  if (urlInput) urlInput.addEventListener("input", debounce(updateLivePreview, 250));

  // QR Type Radios
  document.querySelectorAll('input[name="qr-type"]').forEach((radio) => {
    radio.addEventListener("change", updateLivePreview);
  });

  // Repository Filters
  document.querySelectorAll(".repo-filter-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".repo-filter-btn").forEach((b) => {
        b.classList.remove("bg-secondary", "text-on-secondary", "shadow-md");
        b.classList.add("text-on-surface-variant");
      });
      btn.classList.add("bg-secondary", "text-on-secondary", "shadow-md");
      btn.classList.remove("text-on-surface-variant");
      state.qrFilter = btn.getAttribute("data-filter");
      renderRepository();
    });
  });

  // Repository Search
  const repoSearch = document.getElementById("repo-search-input");
  if (repoSearch) {
    repoSearch.addEventListener("input", (e) => {
      state.qrSearch = e.target.value;
      renderRepository();
    });
  }

  // Top Search Input
  const topSearch = document.getElementById("top-search-input");
  if (topSearch) {
    topSearch.addEventListener("input", (e) => {
      state.qrSearch = e.target.value;
      navigateTo("mis-codigos");
      if (repoSearch) repoSearch.value = e.target.value;
      renderRepository();
    });
  }

  // Users Search
  const userSearch = document.getElementById("users-search-input");
  if (userSearch) {
    userSearch.addEventListener("input", (e) => {
      state.userSearch = e.target.value;
      renderUsersTable();
    });
  }
}

// ============================================================================
// UTILITY FUNCTIONS
// ============================================================================

function debounce(fn, wait) {
  let timer;
  return function (...args) {
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), wait);
  };
}

function escapeHtml(str) {
  if (!str) return "";
  return String(str).replace(/[&<>"']/g, function (m) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
  });
}

function formatDate(isoStr) {
  if (!isoStr) return "Reciente";
  try {
    const d = new Date(isoStr);
    return d.toLocaleDateString("es-DO", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
  } catch (e) {
    return isoStr;
  }
}

function formatShortDate(isoStr) {
  if (!isoStr) return "-";
  try {
    const d = new Date(isoStr);
    return d.toLocaleDateString("es-DO", { day: "2-digit", month: "short", year: "2-digit" });
  } catch (e) {
    return isoStr;
  }
}
